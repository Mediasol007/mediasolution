<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Solution Broadcast Panel</title>
<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#07182d;
  color:#fff;
}
header{
  background:#1f5eff;
  padding:20px 30px;
  font-size:32px;
  font-weight:bold;
}
small{display:block;font-size:14px;font-weight:400}
.wrap{padding:30px}
.cards{display:flex;gap:20px;flex-wrap:wrap}
.card{
  flex:1;
  min-width:180px;
  border-radius:15px;
  padding:20px;
  background:#12325c;
}
h2{margin:0;font-size:40px}
table{
  width:100%;
  margin-top:30px;
  border-collapse:collapse;
  background:#10294b;
}
th,td{
  padding:15px;
  border-bottom:1px solid #21446d;
}
</style>
</head>
<body>

<header>
MEDIA SOLUTION
<small>Broadcast Panel</small>
</header>

<div class="wrap">
  <div class="cards">
    <div class="card"><div>Clients</div><h2>6</h2></div>
    <div class="card"><div>Channels</div><h2>5</h2></div>
    <div class="card"><div>Storage</div><h2>142GB</h2></div>
    <div class="card"><div>Bandwidth</div><h2>1.8TB</h2></div>
  </div>

  <table>
    <tr><th>Channel</th><th>Status</th></tr>
    <tr><td>Sangam TV</td><td>LIVE</td></tr>
    <tr><td>Popli Live</td><td>LIVE</td></tr>
    <tr><td>Sanatan Vedic TV</td><td>LIVE</td></tr>
    <tr><td>KKD News</td><td>LIVE</td></tr>
    <tr><td>News Plus</td><td>OFF</td></tr>
  </table>
</div>

</body>
</html>
